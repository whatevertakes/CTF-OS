# Solve-rate-first routing. Sol directly solves the strongest branch; it is not
# reserved for supervision. Terra and Luna run complete independent attempts.
# GPT-5.6 max is used where another reasoning step can change solve success.
# Fallbacks name profiles, never an inferred "next" model.  Cooldowns are
# profile/selection-scoped unless a profile explicitly declares cooldown_scope: model.

model_profiles:
  sol_xhigh:
    model: "gpt-5.6-sol"
    reasoning_effort: "max"
    fallback: gpt55_xhigh
    use_for:
      - primary_solver
      - hard_solver
      - stalled_branch_takeover
      - final_exploit

  sol_review:
    model: "gpt-5.6-sol"
    reasoning_effort: "max"
    fallback: gpt55_xhigh
    use_for:
      - post_failure_supervisor_review

  sol_high:
    model: "gpt-5.6-sol"
    reasoning_effort: "high"
    fallback: gpt55_high
    use_for:
      - strong_attempt
      - deep_source_review

  sol_medium:
    model: "gpt-5.6-sol"
    reasoning_effort: "medium"
    fallback: gpt55_medium
    use_for:
      - routine_supervision

  terra_xhigh:
    model: "gpt-5.6-terra"
    reasoning_effort: "max"
    fallback: gpt55_xhigh
    use_for:
      - independent_deep_solver

  terra_high:
    model: "gpt-5.6-terra"
    reasoning_effort: "high"
    fallback: gpt55_high
    use_for:
      - feature_implementation
      - exploit_implementation
      - normal_solver_attempt
      - refactor

  terra_medium:
    model: "gpt-5.6-terra"
    reasoning_effort: "medium"
    fallback: gpt55_medium
    use_for:
      - simple_implementation

  luna_high:
    model: "gpt-5.6-luna"
    reasoning_effort: "high"
    fallback: gpt55_high
    use_for:
      - deep_recon

  luna_medium:
    model: "gpt-5.6-luna"
    reasoning_effort: "medium"
    fallback: gpt55_medium
    use_for:
      - fast_complete_solver
      - independent_parallel_attempt

  gpt55_medium:
    model: "gpt-5.5"
    reasoning_effort: "medium"
    use_for:
      - fallback_medium

  gpt55_high:
    model: "gpt-5.5"
    reasoning_effort: "high"
    use_for:
      - fallback_high

  gpt55_xhigh:
    model: "gpt-5.5"
    reasoning_effort: "xhigh"
    use_for:
      - fallback_xhigh

default_roles:
  session_leader: sol_xhigh
  branch_takeover: sol_xhigh
  supervisor: sol_xhigh
  routine_supervisor: sol_medium
  architect: sol_xhigh
  implementer: terra_high
  recon: luna_high
  source: sol_xhigh
  fallback: sol_xhigh
  summarizer: luna_medium
  verifier: sol_high
  final_judge: sol_xhigh

worker_policy:
  hard_categories:
    - pwn
    - rev
    - crypto
  cheap_recon_first: false
  promote_to_sol_after_failures: 2
  promotion_profile: sol_review
  max_supervisor_plan_revisions: 5
  stop_new_workers_on_quota_warning: true

model_policy:
  easy:
    recon_fast: luna_high
    exploit_fast: terra_high
    verifier: sol_high
    summarizer: terra_medium
  medium:
    recon_fast: terra_high
    recon_deep: terra_high
    exploit_main: sol_xhigh
    exploit_alt: terra_xhigh
    verifier: sol_xhigh
    final_judge: sol_xhigh
  hard:
    recon_deep: sol_xhigh
    source_deep: sol_xhigh
    exploit_main: sol_xhigh
    exploit_alt: terra_xhigh
    fallback: sol_xhigh
    verifier: sol_xhigh
    final_judge: sol_xhigh
