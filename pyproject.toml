[project]
name = "ctf-os"
version = "4.0.0"
description = "Verified asynchronous portfolio racing for authorized CTF challenges"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2", "regex==2026.7.19"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ctf_os*"]

[tool.setuptools.package-data]
ctf_os = [
  "resources/agent-policy.md",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in tests requiring locally built Docker category images"]
