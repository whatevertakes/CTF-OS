[project]
name = "ctf-os"
version = "2.1.0"
description = "Sol-native support tools for authorized CTF intake and solving"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ctf_os*"]

[tool.setuptools.package-data]
ctf_os = ["resources/agent-policy.md", "resources/delegation-templates.yaml", "resources/knowledge/playbooks/*.md"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
