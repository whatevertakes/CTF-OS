[project]
name = "ctf-os-claude"
version = "3.0.0"
description = "Separated manual Claude rescue runtime for authorized CTF-OS solves"
requires-python = ">=3.11"
dependencies = ["cryptography>=45.0.0", "PyYAML>=6.0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ctf_os*"]

[tool.setuptools.package-data]
ctf_os = [
  "resources/agent-policy.md",
  "resources/run-workspace-migration.md",
  "resources/delegation-templates.yaml",
  "resources/timeout-profiles.yaml",
  "resources/solve-policy.yaml",
  "resources/knowledge/playbooks/*.md",
  "resources/claude-rescue/*.md",
  "resources/claude-rescue/*.json",
  "resources/claude-rescue/modes/*.md",
  "resources/claude-rescue/profiles/*.md",
  "resources/claude-rescue/agents/*.md",
  "resources/claude-rescue/playbooks/*.md",
  "resources/claude-rescue/toolchains/*.yaml",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
