[project]
name = "ctf-os"
version = "0.1.0"
description = "Local-first multi-node CTF agent"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
]

[project.scripts]
ctf-os = "ctf_os.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ctf_os*"]

[tool.setuptools.package-data]
ctf_os = ["resources/*.yaml", "resources/sandbox/*", "resources/knowledge/**/*.md", "resources/knowledge/**/*.json", "resources/knowledge/**/LICENSE", "resources/knowledge/**/.gitkeep"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
