mode: manual_workbench
solver_mode: manual_solve_session

paths:
  incoming: "incoming"
  output: "output/sca-jiwoong-team/jiwoong"

contest:
  name: "SCA CTF 2026"
  team_id: "sca-jiwoong-team"
  flag_patterns:
    - "SCA\\{[^}]+\\}"
    - "FLAG\\{[^}]+\\}"
    - "[A-Z0-9_]+\\{[A-Za-z0-9_!@#$%^&*\\-+=.,?]+\\}"

member:
  name: "jiwoong"
  display_name: "jiwoong"
  owned_categories:
    - pwn
    - web
    - misc

solvers:
  codex:
    enabled: true
    backend: codex_cli
    command: "codex"

worker_policy:
  # A human chooses the actual value on each solve command.
  manual_max_subworkers_ceiling: 16

model_routing:
  enabled: true
  config_path: "config/model-routing.yaml"

runtime_profiles:
  standard:
    enabled: true
  nested_podman_trusted_ctf:
    # Explicit trusted-CTF opt-in only; intake.md records the extra risk.
    enabled: false
    trusted_ctf_only: true

# Host-side ZIP materialization safety limits. Raise only the necessary field
# for a reviewed, authorized CTF attachment such as an OVMF sparse image.
intake:
  zip_limits:
    max_files: 1000
    max_file_bytes: 67108864
    max_total_bytes: 268435456
    max_compression_ratio: 100

sandbox:
  enabled: true
  image: "ctf-os-sandbox:latest"
  max_containers: 1
  # Every parent-owned Docker CLI invocation has a hard wall-clock bound.
  command_timeout_sec: 30
  # Total per-attempt /work + /artifacts budget, including broker mirroring.
  storage_limit_bytes: 8589934592
  storage_inode_limit: 262144
  # Egress is deny-by-default. Until Host/SNI mediation exists, contest.md may
  # declare only one `nc HOST PORT`; CTF-OS resolves it before each container.
  egress_policy: manifest_exact_endpoints
  default_limits:
    memory: "16g"
    cpus: 2.0
