    image: ctf-os-forensics:latest
    tools: [tshark, sleuthkit, foremost, binwalk, exiftool]
  cloud:
    image: ctf-os-cloud:latest
    tools: [aws, gcloud, az, terraform, kubectl, helm, jq, yq]
