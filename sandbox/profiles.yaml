schema_version: 1
base_image: ctf-os-sandbox:latest
profiles:
  base:
    image: ctf-os-base:latest
    tools: [file, strings, readelf, objdump, nm, jq, python3]
  pwn:
    image: ctf-os-pwn:latest
    tools: [pwntools, gdb, patchelf, checksec, ROPgadget, pwninit]
  web:
