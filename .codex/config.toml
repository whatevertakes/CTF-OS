model = "gpt-5.5"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
service_tier = "fast"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
fast_mode = true
goals = true
multi_agent = true
shell_snapshot = true
hooks = true

[shell_environment_policy]
set = { BASH_ENV = "/home/choijiwng/02_ctf_workspace/.codex/env.sh", CTF_WORKSPACE_ROOT = "/home/choijiwng/02_ctf_workspace", XDG_CACHE_HOME = "/home/choijiwng/02_ctf_workspace/.cache/xdg", MPLCONFIGDIR = "/home/choijiwng/02_ctf_workspace/.cache/matplotlib", NUMBA_CACHE_DIR = "/home/choijiwng/02_ctf_workspace/.cache/numba", PIP_CACHE_DIR = "/home/choijiwng/02_ctf_workspace/.cache/pip", UV_CACHE_DIR = "/home/choijiwng/02_ctf_workspace/.cache/uv", NPM_CONFIG_CACHE = "/home/choijiwng/02_ctf_workspace/.cache/npm", PYTHONPYCACHEPREFIX = "/home/choijiwng/02_ctf_workspace/.cache/python-pycache" }

[projects."/home/choijiwng/02_ctf_workspace"]
trust_level = "trusted"

[plugins."google-calendar@openai-curated"]
enabled = false

[plugins."canva@openai-curated-remote"]
enabled = false

[plugins."creative-production@openai-curated-remote"]
enabled = false

[plugins."data-analytics@openai-curated-remote"]
enabled = false

[plugins."figma@openai-curated-remote"]
enabled = false

[plugins."google-calendar@openai-curated-remote"]
enabled = false

[plugins."product-design@openai-curated-remote"]
enabled = false

