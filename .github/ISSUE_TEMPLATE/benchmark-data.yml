name: Benchmark data submission
description: Submit sanitized benchmark run data when direct branch push is not available.
title: "[benchmark-data] "
labels:
  - benchmark-data
body:
  - type: markdown
    attributes:
      value: |
        Attach sanitized benchmark reports and summaries only. Do not attach flags, tokens, private keys, raw secret-bearing logs, or local dependency trees.
  - type: input
    id: benchmark_id
    attributes:
      label: Benchmark ID
      description: The benchmark or challenge identifier.
      placeholder: blindtest_pwn_arduino_breakdown
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Commands Run
      description: Include the exact benchmark and validation commands.
      placeholder: |
        python3 tools/benchmark_runner.py run challenges/<event>/<category>/<challenge>
        python3 tools/evaluate_corpus.py
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result Summary
      description: Summarize status, blockers, and attached sanitized files.
    validations:
      required: true
