name: tmp-captcha-image-export

on:
  push:
    branches:
      - 'tmp/captcha-probe-20260818'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/captcha-probe-20260818
      - name: Export known labeled CAPTCHA as small text chunks
        shell: bash
        run: |
          rm -rf captcha-image-export
          mkdir -p captcha-image-export
          cp captcha-exploit-results/042.body captcha-image-export/known-68rgsm.png
          file captcha-image-export/known-68rgsm.png > captcha-image-export/file.txt
          python3 - <<'PY'
          import base64, json, pathlib, struct, zlib
          src = pathlib.Path('captcha-image-export/known-68rgsm.png').read_bytes()
          b64 = base64.b64encode(src).decode()
          size = 6000
          parts = [b64[i:i+size] for i in range(0, len(b64), size)]
          for i, part in enumerate(parts):
              pathlib.Path(f'captcha-image-export/chunk-{i:03d}.txt').write_text(part)
          # Parse PNG chunks and preserve metadata inventory.
          pos = 8
          chunks = []
          while pos + 12 <= len(src):
              n = struct.unpack('>I', src[pos:pos+4])[0]
              typ = src[pos+4:pos+8].decode('latin1')
              data = src[pos+8:pos+8+n]
              chunks.append({'type': typ, 'length': n, 'preview_hex': data[:64].hex()})
              pos += 12 + n
              if typ == 'IEND': break
          pathlib.Path('captcha-image-export/manifest.json').write_text(json.dumps({
              'label':'68rgsm','byte_length':len(src),'base64_length':len(b64),
              'part_size':size,'part_count':len(parts),'png_chunks':chunks
          }, indent=2))
          PY
          rm captcha-image-export/known-68rgsm.png
      - name: Commit export chunks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f captcha-image-export
          git commit -m 'chore: export labeled CAPTCHA image chunks' || exit 0
          git push origin HEAD:tmp/captcha-probe-20260818
