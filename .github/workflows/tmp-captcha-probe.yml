name: tmp-captcha-image-artifact

on:
  push:
    branches:
      - 'tmp/captcha-probe-20260818'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/captcha-probe-20260818
      - name: Prepare labeled sample and run metadata
        shell: bash
        run: |
          rm -rf captcha-image-artifact
          mkdir -p captcha-image-artifact captcha-run
          cp captcha-exploit-results/042.body captcha-image-artifact/known-68rgsm.png
          printf '%s\n' "$GITHUB_RUN_ID" > captcha-run/run-id.txt
          file captcha-image-artifact/known-68rgsm.png > captcha-run/file.txt
      - name: Upload labeled CAPTCHA
        uses: actions/upload-artifact@v4
        with:
          name: known-captcha-68rgsm
          path: captcha-image-artifact/known-68rgsm.png
          retention-days: 1
      - name: Commit run id
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f captcha-run
          git commit -m 'chore: store CAPTCHA artifact run id' || exit 0
          git push origin HEAD:tmp/captcha-probe-20260818
