name: Data submission validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-data-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate data-only PR paths
        run: |
          case "${{ github.head_ref }}" in
            shyunseok1029|holymo-ly|jiwoongchoi-norun|lee)
              python3 tools/validate_data_submission.py \
                --base "${{ github.event.pull_request.base.sha }}" \
                --head "${{ github.event.pull_request.head.sha }}"
              ;;
            *)
              echo "Non-runner branch; treating this as an owner/framework PR."
              echo "Team runner submissions must use one of: shyunseok1029, holymo-ly, jiwoongchoi-norun, lee."
              ;;
          esac
