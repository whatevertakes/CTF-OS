name: CTF-OS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: CTF-OS / unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Full pytest suite
        run: uv run pytest -q
      - name: Second Surgery and policy fault regressions
        run: >-
          uv run pytest -q
          tests/test_second_surgery.py
          tests/test_closed_loop.py
          tests/test_agent_contracts.py
          tests/test_exploit_first_policy.py

  package-build:
    name: CTF-OS / package-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build source and wheel packages
        run: uv build
      - name: Verify Claude rescue package data
        run: >-
          python -c "import glob,zipfile;
          p=glob.glob('dist/*.whl')[0];
          n=zipfile.ZipFile(p).namelist();
          assert any(x.endswith('claude-rescue/toolchains/pwn.yaml') for x in n);
          assert any(x.endswith('claude-rescue/profiles/fable-strategy.md') for x in n)"

  docker-rescue-smoke:
    name: CTF-OS / docker-rescue-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Verify real Docker daemon
        run: docker info
      - name: Build pwn rescue image with common persistent tools
        run: >-
          docker build
          --build-arg CTF_OS_PROFILE=pwn
          --file sandbox/Dockerfile.sandbox
          --tag ctf-os-sandbox:pwn
          .
      - name: Real persistent-session, network, recovery and promotion smoke
        env:
          CTF_OS_DOCKER_SMOKE: "1"
        run: uv run pytest -q tests/test_claude_rescue.py -k real_docker

  attempt-lineage:
    name: CTF-OS / attempt-lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Attempt identity, lineage, schema and migration
        run: >-
          uv run pytest -q
          tests/test_attempt_identity.py
          tests/test_race_lineage.py
          tests/test_workspace.py
          tests/test_race_convergence.py

  benchmark-evaluator:
    name: CTF-OS / benchmark-evaluator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Signed lock, manifest, schedule and evaluator goldens
        run: >-
          uv run pytest -q
          tests/test_benchmark_lock.py
          tests/test_benchmark_runtime.py
          tests/test_benchmark_evaluator.py
          tests/test_eval.py

  compile:
    name: CTF-OS / compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile Python sources and tests
        run: python -m compileall -q ctf_os tests eval
      - name: Repository policy validation
        run: >-
          uv run pytest -q
          tests/test_agent_contracts.py
          tests/test_competition_first.py
          tests/test_exploit_first_policy.py
      - name: Patch whitespace validation
        run: git diff --check
