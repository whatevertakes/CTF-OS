name: CTF-OS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CTF-OS / first-to-flag engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Full pytest suite
        run: uv run pytest -q
      - name: First-to-flag integration contract
        run: uv run pytest -q tests/test_first_to_flag.py tests/test_agent_contracts.py
      - name: Compile Python sources and tests
        run: python -m compileall -q ctf_os tests
      - name: Patch whitespace validation
        run: git diff --check

  package-build:
    name: CTF-OS / package-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv build
