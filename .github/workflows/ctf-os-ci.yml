name: CTF-OS

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CTF-OS / verified race engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Full pytest suite
        run: uv run pytest -q -W error
      - name: Race integration contract
        run: uv run pytest -q tests/test_prepare_images.py tests/test_race_bootstrap.py tests/test_flag_fastpath.py
      - name: Compile Python sources and tests
        run: uv run python -m compileall -q ctf_os tests
      - name: CLI and package smoke
        run: |
          uv run python -m ctf_os.agent_tools --help
          uv build
      - name: Patch whitespace validation
        run: git diff --check
