name: CTF-OS Live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-images:
    name: CTF-OS Live / ten category images
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m ctf_os.agent_tools doctor
      - name: Run opt-in category image smoke
        env:
          CTF_OS_LIVE: "1"
        run: uv run pytest -q -m live
